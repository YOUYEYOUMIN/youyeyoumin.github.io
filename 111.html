let currentIdx = 0;
let showAnswer = false;
const tagBar = document.getElementById("tagBar");
const leftContent = document.getElementById("leftContent");
const rightContent = document.getElementById("rightContent");
const showAnsBtn = document.getElementById("showAnsBtn");
const hideAnsBtn = document.getElementById("hideAnsBtn");

function renderTags(){
  tagBar.innerHTML = "";
  data.forEach((item,idx)=>{
    const btn = document.createElement("button");
    btn.className = "tag-btn"+(idx===currentIdx?" active":"");
    btn.innerText = item.title;
    btn.onclick = ()=>{currentIdx=idx;showAnswer=false;render()};
    tagBar.appendChild(btn);
  })
}
function render(){
  const item = data[currentIdx];
  let qhtml = `<h2>${item.title}</h2><div class="gram-info"><div class="gram-title">语法说明</div>${item.desc}</div>`;
  item.questions.forEach(q=>{
    qhtml += `<div class="ques-item">${q}</div>`
  })
  leftContent.innerHTML = qhtml;

  let ahtml = `<h2>参考答案</h2>`;
  if(showAnswer){
    item.answers.forEach((ans,i)=>{
      ahtml += `<div class="ans-item">${i+1}. ${ans}</div>`
    })
  }else{
    ahtml += `<div style="color:#999">点击上方按钮显示答案</div>`
  }
  rightContent.innerHTML = ahtml;
  renderTags();
}
showAnsBtn.onclick = ()=>{showAnswer=true;render()}
hideAnsBtn.onclick = ()=>{showAnswer=false;render()}
render();
</script>
</body>
