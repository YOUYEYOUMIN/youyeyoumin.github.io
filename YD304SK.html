*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
  background:var(--m-bg);
  color:var(--m-text);
  padding:14px;
}
.level-tabs{
  display:flex;
  gap:4px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.tab-lv{
  padding:9px 16px;
  border:none;
  border-radius:8px;
  background:var(--m-tab-inactive);
  color:#222;
  cursor:pointer;
  font-size:16px;
}
.tab-lv.active{
  background:var(--m-tab-active);
  color:#fff;
}
.art-tabs{
  display:flex;
  gap:4px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.tab-art{
  padding:7px 13px;
  border:none;
  border-radius:6px;
  background:var(--m-art-inactive);
  color:var(--m-text);
  cursor:pointer;
}
.tab-art.active{
  background:var(--m-art-active);
  color:#fff;
}
.container{
  display:grid;
  grid-template-columns:1fr 0.7fr;
  gap:16px;
  height:calc(100vh - 160px);
}
.panel-left,.panel-right{
  background:var(--m-card);
  border:1px solid var(--m-line);
  border-radius:12px;
  padding:20px;
  overflow:auto;
}
h3{
  margin:8px 0 12px;
  color:var(--m-text);
}
p{
  line-height:1.75;
  margin:9px 0;
  font-size:16px;
}
.question-block{
  margin:16px 0;
  padding:14px;
  background:var(--m-question-bg);
  border:1px solid var(--m-line);
  border-radius:9px;
}
.opt{
  display:inline-block;
  margin:5px 7px;
  padding:5px 9px;
  border:1px solid var(--m-opt-border);
  border-radius:5px;
  cursor:pointer;
  user-select:none;
  background:#fff;
  color:var(--m-text);
}
.opt.selected{
  background:var(--m-opt-selected);
}
.answer-mark{
  color:var(--green-right);
  font-weight:bold;
  margin-left:10px;
}
.control-bar{
  margin:16px 0;
  display:flex;
  gap:10px;
}
.btn-ctrl{
  padding:9px 15px;
  border:none;
  border-radius:8px;
  background:var(--m-art-active);
  color:#fff;
  cursor:pointer;
  font-size:15px;
}
.tooltip{
  position:relative;
  color:var(--blue-word);
  font-weight:500;
}
.tooltip-gram{
  color:var(--red-grammar);
  font-weight:500;
  position:relative;
}
.tip{
  visibility:hidden;
  position:absolute;
  z-index:999;
  bottom:115%;
  left:0;
  background:#333;
  color:#fff;
  padding:7px 11px;
  border-radius:6px;
  white-space:nowrap;
  font-size:14px;
  opacity:0;
  transition:opacity 0.25s;
}
.tooltip:hover .tip,
.tooltip-gram:hover .tip{
  visibility:visible;
  opacity:1;
}
.panel-right h4{
  margin-top:16px;
  margin-bottom:7px;
  color:var(--m-sub);
  border-bottom:1px solid var(--m-line);
  padding-bottom:4px;
}
ul{
  padding-left:22px;
  line-height:1.75;
}
</style>
</head>

let curLv = "hsk3";
let curArtIdx = 0;
let answerState = {};
function markText(text, vocList, gramList){
    let html = text;
    const vocSorted = [...vocList].sort((a,b)=>b.w.length - a.w.length);
    vocSorted.forEach(v=>{
        const reg = new RegExp(v.w,"g");
        html = html.replace(reg,`<span class="tooltip">${v.w}<span class="tip">${v.py}｜${v.mean}</span></span>`);
    })
    const gramSorted = [...gramList].sort((a,b)=>b.g.length - a.g.length);
    gramSorted.forEach(g=>{
        const reg = new RegExp(g.g,"g");
        html = html.replace(reg,`<span class="tooltip-gram">${g.g}<span class="tip">${g.exp}</span></span>`);
    })
    return html;
}
function renderArtTabs(){
  const wrap = document.getElementById("artTabs");
  const list = data[curLv];
  wrap.innerHTML = "";
  list.forEach((item,idx)=>{
    const btn = document.createElement("button");
    btn.className = "tab-art"+(idx===curArtIdx?" active":"");
    btn.innerText = item.title;
    btn.onclick = ()=>{curArtIdx=idx;renderAll();};
    wrap.appendChild(btn);
  })
}
function renderAll(){
  renderArtTabs();
  const art = data[curLv][curArtIdx];
  const leftDom = document.getElementById("panelLeft");
  const rightDom = document.getElementById("panelRight");
  answerState = {};
  const markedText = markText(art.text, art.voc, art.gram);
  let htmlLeft = `<h3>${art.title}</h3>${markedText}<div class="control-bar"><button class="btn-ctrl" id="checkBtn">核对答案</button><button class="btn-ctrl" id="resetBtn">重置</button></div>`;
  art.ques.forEach((q,qi)=>{
    htmlLeft += `<div class="question-block"><p>${q.q}</p>`;
    if(q.type==="tf"){
      htmlLeft += `<span class="opt" data-qi="${qi}" data-v="对">✔</span><span class="opt" data-qi="${qi}" data-v="错">✘</span><span class="answer-mark" id="ans${qi}"></span>`;
    }else{
      q.opts.forEach(opt=>{
        htmlLeft += `<span class="opt" data-qi="${qi}" data-v="${opt[0]}">${opt}</span>`;
      })
      htmlLeft += `<span class="answer-mark" id="ans${qi}"></span>`;
    }
    htmlLeft += `</div>`;
  })
  leftDom.innerHTML = htmlLeft;
  let htmlRight = `<h4>生词</h4><ul>`;
  art.voc.forEach(v=>{
    htmlRight += `<li>${v.w} ｜ ${v.py} ｜ ${v.mean}</li>`
  })
  htmlRight += `</ul><h4>语法</h4><ul>`;
  art.gram.forEach(g=>{
    htmlRight += `<li>${g.g} ｜ ${g.exp}</li>`
  })
  htmlRight += `</ul>`;
  rightDom.innerHTML = htmlRight;
  document.querySelectorAll(".opt").forEach(el=>{
    el.onclick = function(){
      const qi = this.dataset.qi;
      const val = this.dataset.v;
      answerState[qi] = val;
      document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(o=>o.classList.remove("selected"));
      this.classList.add("selected");
    }
  })
  document.getElementById("checkBtn").onclick = ()=>{
    art.ques.forEach((q,qi)=>{
      const span = document.getElementById("ans"+qi);
      span.innerText = "【正确："+q.ans+"】";
    })
  }
  document.getElementById("resetBtn").onclick = ()=>{
    renderAll();
  }
}
document.querySelectorAll(".tab-lv").forEach(btn=>{
  btn.onclick = function(){
    document.querySelectorAll(".tab-lv").forEach(b=>b.classList.remove("active"));
    this.classList.add("active");
    curLv = this.dataset.lv;
    curArtIdx = 0;
    renderAll();
  }
})
window.onload = ()=>{renderAll();}
</script>
