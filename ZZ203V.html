            front: "祝愿",
            img: "./ZZ203/zhuyuan.jpg",
            back: `
                <div class="back-inner">
                    <div class="back-row">
                        <img class="card-img" src="./ZZ203/zhuyuan.jpg" alt="祝愿" onerror="this.style.display='none'">
                        <div class="text-part">
                            <p>zhùyuàn（动词）</p>
                            <p>祝愿平安</p>
                            <p>祝愿幸福</p>
                        </div>
                    </div>
                    <div class="sentence-line">例句：我们祝愿一家人可以早日团圆。</div>
                </div>
            `
        },
        {
            front: "团圆",
            img: "./ZZ203/tuanyuan.jpg",
            back: `
                <div class="back-inner">
                    <div class="back-row">
                        <img class="card-img" src="./ZZ203/tuanyuan.jpg" alt="团圆" onerror="this.style.display='none'">
                        <div class="text-part">
                            <p>tuányuán（动词）</p>
                            <p>家人团圆</p>
                            <p>盼望团圆</p>
                        </div>
                    </div>
                    <div class="sentence-line">例句：春节是家人团圆的日子。</div>
                </div>
            `
        },
        // 第6组练习：51‑57
        {
            front: `【练习6：51‑57】<br><br>①帮忙之后，他不要任何____。<br><br>②小礼物代表我的一份____。<br><br>③听完安慰，心里____多了。<br><br>④那件事我____还记得。<br><br>⑤我____感谢你的帮助。<br><br>⑥我们____大家平安幸福。<br><br>⑦春节盼望家人____。`,
            back: `【练习6答案】<br><br>①帮忙之后，他不要任何<strong>报酬</strong>。<br><br>②小礼物代表我的一份<strong>心意</strong>。<br><br>③听完安慰，心里<strong>好受</strong>多了。<br><br>④那件事我<strong>至今</strong>还记得。<br><br>⑤我<strong>衷心</strong>感谢你的帮助。<br><br>⑥我们<strong>祝愿</strong>大家平安幸福。<br><br>⑦春节盼望家人<strong>团圆</strong>。`
        }
    ];

    let currentIndex = 0;
    let isShowBack = false;
    let cards = [...cardList];
    const frontDom = document.getElementById("front");
    const backDom = document.getElementById("back");
    const cardDom = document.getElementById("card");
    const currentPage = document.getElementById("current");
    const totalPage = document.getElementById("total");
    totalPage.innerText = cards.length;

    function renderCard() {
        const item = cards[currentIndex];
        frontDom.innerHTML = item.front;
        backDom.innerHTML = item.back;
        // 判断是练习卡就切换小字号
        if(String(item.front).includes("【练习")){
            frontDom.style.fontSize = "clamp(20px,3.5vw,24px)";
        }else{
            frontDom.style.fontSize = "clamp(44px, 11vw, 64px)";
        }
        if (isShowBack) {
            frontDom.style.display = "none";
            backDom.style.display = "block";
        } else {
            frontDom.style.display = "block";
            backDom.style.display = "none";
        }
        currentPage.innerText = currentIndex + 1;
    }

    cardDom.addEventListener("click", () => {
        isShowBack = !isShowBack;
        renderCard();
    });
    document.getElementById("prev").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("next").addEventListener("click", () => {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("shuffle").addEventListener("click", () => {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        isShowBack = false;
        renderCard();
    });
    renderCard();
</script>
