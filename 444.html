<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK4语法闪卡｜敢</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #e8e6e2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    .flashcard-wrap {
        width: 100%;
        max-width: 660px;
        height: 520px;
        perspective: 1200px;
    }

    .flashcard {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s ease-out;
        cursor: pointer;
    }

    .flashcard.flipped {
        transform: rotateY(180deg);
    }

    .card-face {
        position: absolute;
        inset: 0;
        padding: 36px 28px;
        border-radius: 20px;
        background-color: #ffffff;
        box-shadow: 0 8px 26px rgba(80, 75, 70, 0.13);
        overflow-y: auto;
        -webkit-backface-visibility: hidden !important;
        backface-visibility: hidden !important;
        opacity: 1 !important;
    }

    .card-back {
        transform: rotateY(180deg);
        background-color: #ffffff !important;
    }

    .card-content {
        position: relative;
        z-index: 1;
        text-align: center;
    }

    h2 {
        font-size: 28px;
        color: #333;
        margin-bottom: 22px;
    }

    .label-title {
        font-weight: bold;
        color: #555862;
        margin-top: 18px;
        margin-bottom: 10px;
        font-size: 20px;
    }

    p {
        font-size: 19px;
        line-height: 1.85;
        color: #333;
        margin-bottom: 12px;
    }

    .grammar-hl {
        color: #2b4870;
        font-weight: bold;
    }

    .tip-warn {
        color: #c27028;
    }

    .tip-error {
        color: #b83c3c;
    }
    .ok{
        color:#278b38;
    }
    .err{
        color:#b83c3c;
    }

    .click-hint {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: #999;
    }
</style>
</head>

<body>
<div class="flashcard-wrap">
    <div class="flashcard" id="card">
        <!-- 正面：标题、使用范围、例句 -->
        <div class="card-face card-front">
            <div class="card-content">
                <h2>敢（gǎn）｜能愿动词</h2>
                <div class="label-title">【使用范围】</div>
                <p>表示人有没有胆量、勇气去做一件事。</p>

                <div class="label-title">【例句】</div>
                <p>1. <span class="grammar-hl">敢</span>面对困难，才会不断进步。</p>
                <p>2. 我<span class="grammar-hl">不敢</span>去找老师问问题。</p>
            </div>
            <div class="click-hint">点击卡片翻转</div>
        </div>

        <!-- 背面【只有3块内容：句式 / 使用限制 / 常见错误】 -->
        <div class="card-face card-back">
            <div class="card-content">
                <div class="label-title">【句式】</div>
                <p>敢 + 动词<br>
                   不敢 + 动词<br>
                   你敢不敢 + 动词</p>

                <div class="label-title tip-warn">⚠️使用限制</div>
                <p>1. “敢”放在动词前面，可以接“去、来”。<br>
                   2. 不能说“很敢”。<br>
                   3. “敢”和动词中间不要加“要”。</p>

                <div class="label-title tip-error">❌常见错误</div>
                <p><span class="err">✖</span> 我不敢要去问老师问题。<br>
                <span class="ok">✔</span> 我不敢去问老师问题。</p>

                <p><span class="err">✖</span> 他很敢爬山。<br>
                <span class="ok">✔</span> 他敢爬山。</p>
            </div>
        </div>
    </div>
</div>

<script>
    const card = document.getElementById("card");
    card.addEventListener("click", () => {
        card.classList.toggle("flipped");
    });
</script>
</body>
</html>
