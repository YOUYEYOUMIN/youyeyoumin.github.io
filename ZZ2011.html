<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZZ2011</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
    }
    body {
        background-color: #f7f9fc;
        padding: 24px 16px;
    }
    h1 {
        text-align: center;
        color: #002b5c;
        margin-bottom: 28px;
        font-size: clamp(22px, 4vw, 28px);
    }
    .wrap {
        max-width: 620px;
        margin: 0 auto;
    }
    .flashcard {
        background: #ffffff;
        border-radius: 20px;
        min-height: 540px;
        padding: 32px 20px;
        box-shadow: 0 4px 14px rgba(0, 43, 92, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s;
    }
    .flashcard:hover {
        box-shadow: 0 6px 20px rgba(0, 43, 92, 0.18);
    }
    /* 生词正面：大字 */
    .front-text {
        font-size: clamp(44px, 11vw, 64px);
        font-weight: bold;
        color: #002b5c;
        text-align: center;
        line-height: 1.9;
    }
    /* 练习卡正反面统一字号，句子居中 */
    .back-text {
        font-size: clamp(20px, 3.5vw, 24px);
        color: #002b5c;
        line-height: 2.0;
        display: none;
        width: 100%;
        text-align: center;
    }
    .back-inner {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        text-align: left;
    }
    .back-row {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-start;
    }
    .card-img {
        width: min(220px, 70vw);
        height: 160px;
        object-fit: cover;
        border-radius: 10px;
        background-color: #eef2f7;
    }
    .text-part {
        flex: 1;
        min-width: 200px;
    }
    .text-part p {
        margin: 4px 0;
    }
    .sentence-line {
        width: 100%;
        margin-top: 14px;
        text-align: center;
    }
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 26px;
        flex-wrap: wrap;
    }
    button {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: #002b5c;
        color: #ffffff;
        font-size: clamp(16px, 3vw, 20px);
        cursor: pointer;
    }
    button:hover {
        opacity: 0.85;
    }
    .page-info {
        text-align: center;
        margin-top: 16px;
        color: #002b5c;
        font-size: clamp(16px, 3vw, 20px);
    }
</style>
</head>
<body>

        <button id="prev">上一张</button>
        <button id="next">下一张</button>
        <button id="shuffle">随机洗牌</button>

</div>

            `
        },
        {
            front: "包围",
            img: "./ZZ2011/baowei.jpg",
            back: `
                <div class="back-inner">
                    <div class="back-row">
                        <img class="card-img" src="./ZZ2011/baowei.jpg" alt="包围" onerror="this.style.display='none'">
                        <div class="text-part">
                            <p>bāo wéi（动词）</p>
                            <p>被包围</p>
                            <p>包围起来</p>

                        </div>
                    </div>
                    <div class="sentence-line">例句：我被花园的花香包围了。</div>
                </div>
            `
        },
        {
            front: "凭",
            img: "./ZZ2011/ping.jpg",
            back: `
                <div class="back-inner">
                    <div class="back-row">
                        <img class="card-img" src="./ZZ2011/ping.jpg" alt="凭" onerror="this.style.display='none'">
                        <div class="text-part">
                            <p>píng（介词）</p>

                        </div>
                    </div>

                </div>
            `
        },
        {
            front: "方式",
            img: "./ZZ2011/fangshi.jpg",
            back: `
                <div class="back-inner">
                    <div class="back-row">
                        <img class="card-img" src="./ZZ2011/fangshi.jpg" alt="方式" onerror="this.style.display='none'">
                        <div class="text-part">

        {
            front: `①她收到了一束______。<br><br>②听到这个消息，我十分______。`,

        },
        {
            front: `①听到好消息，我______开心起来。<br><br>②蝴蝶飞进了花______里面。`,
            back: `①听到好消息，我<strong>顿时</strong>开心起来。<br><br>②蝴蝶飞进了花<strong>丛</strong>里面。`
        },
        {
            front: `①家人的关心让我心里很______。<br><br>②海边是一幅十分美丽的______。`,
            back: `①家人的关心让我心里很<strong>温暖</strong>。<br><br>②海边是一幅十分美丽的<strong>景象</strong>。`
        },
        {
            front: `①假期结束，我______离开家乡。<br><br>②遇到困难不要______放弃。`,
            back: `①假期结束，我<strong>舍不得</strong>离开家乡。<br><br>②遇到困难不要<strong>轻易</strong>放弃。`
        },
        {
            front: `①我被花香______了。<br><br>②他______自己的努力获得成功。`,
            back: `①我被花香<strong>包围</strong>了。<br><br>②他<strong>凭</strong>自己的努力获得成功。`
        },
        {
            front: `①每个人都有自己的生活______。<br><br>②我们要______现在的幸福生活。`,
            back: `①每个人都有自己的生活<strong>方式</strong>。<br><br>②我们要<strong>珍惜</strong>现在的幸福生活。`
        }
    ];
    let currentIndex = 0;
    let isShowBack = false;
    let cards = [...cardList];
    const frontDom = document.getElementById("front");
    const backDom = document.getElementById("back");
    const cardDom = document.getElementById("card");
    const currentPage = document.getElementById("current");
    const totalPage = document.getElementById("total");
    totalPage.innerText = cards.length;
    function renderCard() {
        const item = cards[currentIndex];
        frontDom.innerHTML = item.front;
        backDom.innerHTML = item.back;
        // 判断：如果是练习卡（包含下划线），正面使用练习字号；生词卡用超大汉字字号
        if(String(item.front).includes("____")){
            frontDom.style.fontSize = "clamp(20px,3.5vw,24px)";
        }else{
            frontDom.style.fontSize = "clamp(44px, 11vw, 64px)";
        }
        if (isShowBack) {
            frontDom.style.display = "none";
            backDom.style.display = "block";
        } else {
            frontDom.style.display = "block";
            backDom.style.display = "none";
        }
        currentPage.innerText = currentIndex + 1;
    }
    cardDom.addEventListener("click", () => {
        isShowBack = !isShowBack;
        renderCard();
    });
    document.getElementById("prev").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("next").addEventListener("click", () => {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("shuffle").addEventListener("click", () => {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        isShowBack = false;
        renderCard();
    });
    renderCard();
</script>
</body>
</html>
