<style>
:root{
  --m-bg:#eef1f4;

  --m-art-inactive:#e3e9ef;
  --m-art-active:#7f97ad;
  --m-text:#2f3a44;

  --m-question-bg:#f4f7fa;
  --m-opt-border:#b9c4ce;
  --m-opt-selected:#c9d8e6;
  --blue-word:#3f6ea5;
  --red-grammar:#b04a4a;
  --green-right:#3f8f5a;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
  background:var(--m-bg);
  color:var(--m-text);
  padding:14px;
}
.level-tabs{
  display:flex;
  gap:4px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.tab-lv{
  padding:9px 16px;
  border:none;
  border-radius:8px;
  background:var(--m-tab-inactive);
  color:#222;
  cursor:pointer;
  font-size:16px;
}
.tab-lv.active{
  background:var(--m-tab-active);
  color:#fff;
}
.art-tabs{
  display:flex;
  gap:4px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.tab-art{
  padding:7px 13px;
  border:none;
  border-radius:6px;
  background:var(--m-art-inactive);
  color:var(--m-text);
  cursor:pointer;
}
.tab-art.active{
  background:var(--m-art-active);
  color:#fff;
}
.container{
  display:grid;
  grid-template-columns:1fr 0.7fr;
  gap:16px;
  height:calc(100vh - 160px);
}
.panel-left,.panel-right{
  background:var(--m-card);
  border:1px solid var(--m-line);
  border-radius:12px;
  padding:20px;
  overflow:auto;
}
h3{
  margin:8px 0 12px;
  color:var(--m-text);
}
p{
  line-height:1.75;
  margin:9px 0;
  font-size:16px;
}
.question-block{
  margin:16px 0;
  padding:14px;
  background:var(--m-question-bg);
  border:1px solid var(--m-line);
  border-radius:9px;
}
.opt{
  display:inline-block;
  margin:5px 7px;
  padding:5px 9px;
  border:1px solid var(--m-opt-border);
  border-radius:5px;
  cursor:pointer;
  user-select:none;
  background:#fff;
  color:var(--m-text);
}
.opt.selected{
  background:var(--m-opt-selected);
}
.answer-mark{
  color:var(--green-right);
  font-weight:bold;
  margin-left:10px;
}
.control-bar{
  margin:16px 0;
  display:flex;
  gap:10px;
}
.btn-ctrl{
  padding:9px 15px;
  border:none;
  border-radius:8px;
  background:var(--m-art-active);
  color:#fff;
  cursor:pointer;
  font-size:15px;
}
.tooltip{
  position:relative;
  color:var(--blue-word);
  font-weight:500;
  cursor:pointer;
}
.tip{
  visibility:hidden;
  position:absolute;
  z-index:999;
  bottom:115%;
  left:0;
  background:#333;
  color:#fff;
  padding:7px 11px;
  border-radius:6px;
  white-space:nowrap;
  font-size:14px;
  opacity:0;
  transition:opacity 0.25s;
}
/*电脑鼠标悬浮 */
.tooltip:hover .tip{
  visibility:visible;
  opacity:1;
}
/*手机点击加上这个class就显示 */
.tooltip.tip-show .tip{
  visibility:visible;
  opacity:1;
}
.panel-right h4{
  margin-top:16px;
  margin-bottom:7px;
  color:var(--m-sub);
  border-bottom:1px solid var(--m-line);
  padding-bottom:4px;
}
ul{
  padding-left:22px;
  line-height:1.75;
}
@media(max-width:920px){
  .container{
    grid-template-columns:1fr;
    height:auto;
  }
}
</style>
</head>

let currentLv = "hsk3";
let currentArtIdx = 0;
const levelBtns = document.querySelectorAll(".tab-lv");
const artTabsWrap = document.getElementById("artTabs");
const panelLeft = document.getElementById("panelLeft");
const panelRight = document.getElementById("panelRight");

levelBtns.forEach(btn=>{
    btn.onclick = ()=>{
        levelBtns.forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        currentLv = btn.dataset.lv;
        currentArtIdx = 0;
        renderArtTabs();
        renderContent();
    }
});

function renderArtTabs(){
    artTabsWrap.innerHTML = "";
    const list = data[currentLv];
    list.forEach((item,idx)=>{
        const b = document.createElement("button");
        b.className = "tab-art";
        if(idx === currentArtIdx) b.classList.add("active");
        b.innerText = item.title;
        b.onclick = ()=>{
            currentArtIdx = idx;
            renderArtTabs();
            renderContent();
        }
        artTabsWrap.appendChild(b);
    })
}

function renderContent(){
    const item = data[currentLv][currentArtIdx];
    let htmlLeft = `<h3>${item.title}</h3>${item.text}`;
    htmlLeft += `<div class="control-bar">
        <button class="btn-ctrl" onclick="showAllAnswer()">显示全部答案</button>
        <button class="btn-ctrl" onclick="hideAllAnswer()">隐藏全部答案</button>
    </div>`;
    htmlLeft += `<div class="question-block">`;

    item.ques.forEach((qobj,qIdx)=>{
        htmlLeft += `<div><p>${qobj.q}</p>`;
        if(qobj.type === "tf"){
            htmlLeft += `
                <span class="opt" data-q="${qIdx}" data-val="对">对</span>
                <span class="opt" data-q="${qIdx}" data-val="错">错</span>
                <span class="answer-mark ans${qIdx}" style="display:none">正确：${qobj.ans}</span>
            `;
        }else if(qobj.type === "abcd"){
            qobj.opts.forEach((optTxt,optIndex)=>{
                htmlLeft += `<span class="opt" data-q="${qIdx}" data-optidx="${optIndex}">${optTxt}</span>`;
            })
            htmlLeft += `<span class="answer-mark ans${qIdx}" style="display:none">正确：${qobj.ans}</span>`;
        }
        htmlLeft += `</div><br>`;
    })
    htmlLeft += `</div>`;
    panelLeft.innerHTML = htmlLeft;

    document.querySelectorAll(".opt").forEach(opt=>{
        opt.onclick = function(){
            const q = this.dataset.q;
            document.querySelectorAll(`.opt[data-q="${q}"]`).forEach(o=>o.classList.remove("selected"));
            this.classList.add("selected");
        }
    })

    // 处理生词点击：手机点击切换tip‑show；点击空白关闭
    document.querySelectorAll(".tooltip").forEach(el=>{
        el.onclick = function(e){
            e.stopPropagation();
            document.querySelectorAll(".tooltip").forEach(t=>{
                if(t!==this) t.classList.remove("tip-show");
            })
            this.classList.toggle("tip-show");
        }
    })
    document.body.onclick = function(){
        document.querySelectorAll(".tooltip").forEach(t=>t.classList.remove("tip-show"));
    }

    let htmlRight = `<h4>本课生词</h4><ul>`;
    item.voc.forEach(v=>{
        htmlRight += `<li><strong>${v.w}</strong>｜${v.py}｜${v.mean}</li>`;
    })
    htmlRight += `</ul><h4>语法</h4><ul>`;
    item.gram.forEach(g=>{
        htmlRight += `<li><strong>${g.g}</strong><br>${g.exp}</li>`;
    })
    htmlRight += `</ul>`;
    panelRight.innerHTML = htmlRight;
}

window.showAllAnswer = function(){
    const item = data[currentLv];
    item.ques.forEach((_,i)=>{
        document.querySelector(`.ans${i}`).style.display="inline-block";
    })
}
window.hideAllAnswer = function(){
    const item = data[currentLv];
    item.ques.forEach((_,i)=>{
        document.querySelector(`.ans${i}`).style.display="none";
    })
}

renderArtTabs();
renderContent();
</script>
