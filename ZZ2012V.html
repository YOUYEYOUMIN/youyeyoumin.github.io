<title>ZZ2012</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, sans-serif;
    }
    body {
        background-color: #f7f9fc;
        padding: 24px 16px;
    }
    h1 {
        text-align: center;
        color: #002b5c;
        margin-bottom: 28px;
        font-size: clamp(22px, 4vw, 28px);
    }
    .wrap {
        max-width: 620px;
        margin: 0 auto;
    }
    .flashcard {
        background: #ffffff;
        border-radius: 20px;
        min-height: 540px;
        padding: 32px 20px;
        box-shadow: 0 4px 14px rgba(0, 43, 92, 0.12);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s;
    }
    .flashcard:hover {
        box-shadow: 0 6px 20px rgba(0, 43, 92, 0.18);
    }
    /* 生词正面：大字 */
    .front-text {
        font-size: clamp(44px, 11vw, 64px);
        font-weight: bold;
        color: #002b5c;
        text-align: center;
        line-height: 1.9;
    }
    /* 练习卡正反面统一字号，句子居中 */
    .back-text {
        font-size: clamp(20px, 3.5vw, 24px);
        color: #002b5c;
        line-height: 2.0;
        display: none;
        width: 100%;
        text-align: center;
    }
    .back-inner {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        text-align: left;
    }
    .back-row {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-start;
    }
    .card-img {
        width: min(220px, 70vw);
        height: 160px;
        object-fit: cover;
        border-radius: 10px;
        background-color: #eef2f7;
    }
    .text-part {
        flex: 1;
        min-width: 200px;
    }
    .text-part p {
        margin: 4px 0;
    }
    .sentence-line {
        width: 100%;
        margin-top: 14px;
        text-align: center;
    }
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 26px;
        flex-wrap: wrap;
    }
    button {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: #002b5c;
        color: #ffffff;
        font-size: clamp(16px, 3vw, 20px);
        cursor: pointer;
    }
    button:hover {
        opacity: 0.85;
    }
    .page-info {
        text-align: center;
        margin-top: 16px;
        color: #002b5c;
        font-size: clamp(16px, 3vw, 20px);
    }
</style>
</head>

    let currentIndex = 0;
    let isShowBack = false;
    let cards = [...cardList];
    const frontDom = document.getElementById("front");
    const backDom = document.getElementById("back");
    const cardDom = document.getElementById("card");
    const currentPage = document.getElementById("current");
    const totalPage = document.getElementById("total");
    totalPage.innerText = cards.length;
    function renderCard() {
        const item = cards[currentIndex];
        frontDom.innerHTML = item.front;
        backDom.innerHTML = item.back;
        // 判断：如果是练习卡（包含下划线），正面使用练习字号；生词卡用超大汉字字号
        if(String(item.front).includes("____")){
            frontDom.style.fontSize = "clamp(20px,3.5vw,24px)";
        }else{
            frontDom.style.fontSize = "clamp(44px, 11vw, 64px)";
        }
        if (isShowBack) {
            frontDom.style.display = "none";
            backDom.style.display = "block";
        } else {
            frontDom.style.display = "block";
            backDom.style.display = "none";
        }
        currentPage.innerText = currentIndex + 1;
    }
    cardDom.addEventListener("click", () => {
        isShowBack = !isShowBack;
        renderCard();
    });
    document.getElementById("prev").addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("next").addEventListener("click", () => {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            isShowBack = false;
            renderCard();
        }
    });
    document.getElementById("shuffle").addEventListener("click", () => {
        for (let i = cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        currentIndex = 0;
        isShowBack = false;
        renderCard();
    });
    renderCard();
</script>
