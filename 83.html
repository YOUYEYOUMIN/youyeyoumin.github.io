<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《线上生活》阶梯写作练习</title>
    <style>
        * {
            box-sizing: border-box;
            margin:0;
            padding:0;
            font-family: system-ui, "Microsoft Yahei", sans-serif;
        }
        body{
            background-color:#f6f9fc;
            padding:20px 16px;
        }
        .container{
            max-width:720px;
            margin:0 auto;
        }
        h1{
            text-align:center;
            color:#1f4e79;
            margin-bottom:24px;
            font-size:24px;
        }
        .card{
            background:#fff;
            border-radius:18px;
            padding:28px;
            box-shadow:0 3px 12px rgba(31,78,121,0.1);
            min-height:580px;
        }
        .level-tag{
            display:inline-block;
            background:#e8f4fc;
            color:#1f4e79;
            padding:4px 10px;
            border-radius:8px;
            font-size:14px;
            margin-bottom:14px;
        }
        .question{
            font-size:18px;
            line-height:1.7;
            margin-bottom:18px;
            color:#222;
        }
        .tips{
            background:#f0f7ff;
            padding:14px;
            border-radius:12px;
            margin-bottom:16px;
        }
        .tips-title{
            font-weight:bold;
            color:#1f4e79;
            margin-bottom:8px;
        }
        .tip-text{
            font-size:15px;
            line-height:1.6;
            color:#333;
        }
        .answer-ref{
            background:#fff7e6;
            padding:14px;
            border-radius:12px;
            margin-bottom:16px;
        }
        .ref-title{
            font-weight:bold;
            color:#b36b00;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .ref-content{
            margin-top:10px;
            font-size:15px;
            line-height:1.6;
            display:none;
        }
        .toggle-ref{
            border:none;
            background:#b36b00;
            color:#fff;
            border-radius:6px;
            padding:4px 8px;
            font-size:13px;
            cursor:pointer;
        }
        textarea{
            width:100%;
            min-height:140px;
            padding:14px;
            border:1px solid #c7d8e8;
            border-radius:12px;
            font-size:16px;
            line-height:1.6;
            resize:vertical;
        }
        .page-info{
            text-align:center;
            margin:18px 0;
            color:#1f4e79;
        }
        .btn-group{
            display:flex;
            justify-content:center;
            gap:16px;
            margin-top:24px;
            flex-wrap: wrap;
        }
        button{
            padding:12px 26px;
            border:none;
            border-radius:10px;
            background:#1f4e79;
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        button:disabled{
            background:#a4b8cc;
            cursor:not-allowed;
        }
        .btn-view-all{
            background:#386b9c;
        }
        /*弹窗样式*/
        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            padding:20px;
            overflow-y:auto;
        }
        .modal-content{
            background:white;
            max-width:700px;
            margin:20px auto;
            border-radius:16px;
            padding:24px;
        }
        .modal-title{
            font-size:20px;
            font-weight:bold;
            color:#1f4e79;
            margin-bottom:16px;
        }
        .answer-item{
            margin-bottom:14px;
            border-bottom:1px solid #eee;
            padding-bottom:12px;
        }
        .q-title{
            font-weight:bold;
            margin-bottom:4px;
        }
        .close-modal{
            margin-top:16px;
            width:100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>《线上生活》阶梯写作练习</h1>
        <div class="card">
            <div class="level-tag" id="level">难度：初级短句</div>
            <div class="question" id="question"></div>
            <div class="tips">
                <div class="tips-title">💡词汇&语法提示</div>
                <div class="tip-text" id="tip"></div>
            </div>
            <div class="answer-ref">
                <div class="ref-title">
                    参考范文
                    <button class="toggle-ref" id="toggleRef">显示参考</button>
                </div>
                <div class="ref-content" id="refContent"></div>
            </div>
            <textarea id="answer" placeholder="在这里写你的回答……"></textarea>
        </div>
        <div class="page-info">
            第 <span id="current">1</span> / <span id="total">8</span> 题
        </div>
        <div class="btn-group">
            <button id="prev">上一页</button>
            <button id="next">下一页</button>
            <button class="btn-view-all" id="viewAll">查看全部作答</button>
        </div>
    </div>
    <!-- 弹窗：全部答案 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title">全部作答内容</div>
            <div id="allAnswerBox"></div>
            <button class="close-modal" id="closeModal">关闭</button>
        </div>
    </div>
<script>
const questionList = [
    {
        level:"难度：初级短句",
        q:"（1）你平时经常上网吗？上网一般会做什么事情？",
        tip:"参考词语：上网、手机、聊天、看视频\n参考句式：我经常……。我喜欢……。",
        ref:"我平时经常上网。我会用手机聊天，也喜欢看各种短视频。"
    },
    {
        level:"难度：初级短句",
        q:"（2）线上学习有哪些好处？举一两个例子说一说。",
        tip:"参考词语：方便、在家、课程、节省\n参考句式：……很方便。可以……。",
        ref:"线上学习很方便，我们可以在家上课，还可以节省路上的时间。"
    },
    {
        level:"难度：中级对比句",
        q:"（3）和线上上课相比，线下课堂有什么不一样？",
        tip:"参考词语：相比、交流、气氛、同学\n参考句式：和A相比，B……",
        ref:"和线上上课相比，线下课堂的学习气氛更好，可以直接和老师同学面对面交流。"
    },
    {
        level:"难度：中级对比句",
        q:"（4）长时间上网会带来哪些不好的影响？",
        tip:"参考词语：眼睛、疲劳、浪费、注意力\n参考句式：如果……，就会……，尤其是……",
        ref:"如果长时间上网，就会让眼睛很疲劳，尤其是玩手机，很容易浪费很多时间。"
    },
    {
        level:"难度：多句表达",
        q:"（5）线上购物给普通人的生活带来哪些变化？",
        tip:"参考词语：网购、选择、快递、便宜\n参考句式：一方面……另一方面……",
        ref:"一方面网上的商品选择很多，价格比较便宜；另一方面快递很快，在家就可以收到东西。"
    },
    {
        level:"难度：多句表达",
        q:"（6）你认为网络最大的优点是什么？最大的缺点是什么？",
        tip:"参考词语：信息、快速、虚假、沉迷\n参考句式：正因为……，所以……；但是……",
        ref:"正因为网络传递信息很快，所以我们可以知道全世界的新闻。但是网上也会有一些虚假的消息。"
    },
    {
        level:"难度：段落写作",
        q:"（7）为了用好网络，我们平时应该遵守哪些原则？",
        tip:"参考词语：控制、分辨、合理、保护\n参考句式：只有……，才……；A给B带来……",
        ref:"只有学会控制上网的时间，分辨真假信息，我们才可以用好网络。合理上网会给我们的生活带来很多帮助。"
    },
    {
        level:"难度：作文整合（高阶）",
        q:"（8）谈谈你的《线上生活》，整合前面问题写一篇作文，150字以上。",
        tip:"参考全部词语：上网 手机 方便 课程 快递 网购 疲劳 沉迷 分辨 信息 虚假 气氛 交流 控制 合理 节省 注意力\n关联词：既……又……；……尤其是……；只有……，才……；正因为……，所以……；A给B带来……",
        ref:"# 线上生活\n现在我的生活离不开网络。上网既可以线上学习，也可以网购，快递把商品送到家里，非常方便。\n和线上上课相比，我更喜欢线下课堂，因为可以和同学面对面交流。\n正因为网络信息传播很快，我们可以了解世界，但是网上也存在虚假信息，尤其是年轻人容易沉迷手机，让眼睛疲劳。\n只有学会合理控制上网时间，分辨网上的消息，网络才能真正给我们的生活带来帮助。这就是我的线上生活。"
    }
];
let current = 0;
let saveAnswers = Array(questionList.length).fill("");
let refShow = false;
const levelDom = document.getElementById("level");
const qDom = document.getElementById("question");
const tipDom = document.getElementById("tip");
const refContentDom = document.getElementById("refContent");
const toggleRefBtn = document.getElementById("toggleRef");
const answerDom = document.getElementById("answer");
const currentDom = document.getElementById("current");
const totalDom = document.getElementById("total");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const viewAllBtn = document.getElementById("viewAll");
const modal = document.getElementById("modal");
const allAnswerBox = document.getElementById("allAnswerBox");
const closeModalBtn = document.getElementById("closeModal");
totalDom.innerText = questionList.length;
function render(){
    const item = questionList[current];
    levelDom.innerText = item.level;
    qDom.innerText = item.q;
    tipDom.innerText = item.tip;
    refContentDom.innerText = item.ref;
    answerDom.value = saveAnswers[current];
    refContentDom.style.display = refShow ? "block" : "none";
    toggleRefBtn.innerText = refShow ? "隐藏参考" : "显示参考";
    currentDom.innerText = current+1;
    prevBtn.disabled = current === 0;
    if(current === questionList.length -1){
        nextBtn.innerText = "完成";
    }else{
        nextBtn.innerText = "下一页";
    }
}
// 切换参考答案显示/隐藏
toggleRefBtn.onclick = ()=>{
    refShow = !refShow;
    render();
}
// 弹窗：渲染全部答案
function renderAllAnswer(){
    let html = "";
    for(let i=0; i<questionList.length; i++){
        html += `<div class="answer-item">
            <div class="q-title">${questionList[i].q}</div>
            <div>${saveAnswers[i] || "（还没有写答案）"}</div>
        </div>`;
    }
    allAnswerBox.innerHTML = html;
}
answerDom.addEventListener("input", ()=>{
    saveAnswers[current] = answerDom.value;
})
prevBtn.addEventListener("click",()=>{
    if(current>0){
        current--;
        render();
    }
})
nextBtn.addEventListener("click",()=>{
    saveAnswers[current] = answerDom.value;
    if(current < questionList.length -1){
        current++;
        render();
    }else{
        alert("练习完成！你可以复制作文提交。");
    }
})
// 查看全部作答：必须当前题目不为空才能打开
viewAllBtn.addEventListener("click",()=>{
    saveAnswers[current] = answerDom.value.trim();
    if(saveAnswers[current] === ""){
        alert("请先完成本题作答，才可以查看全部作答！");
        return;
    }
    renderAllAnswer();
    modal.style.display = "block";
})
closeModalBtn.addEventListener("click",()=>{
    modal.style.display = "none";
})
// 点击弹窗空白关闭
modal.addEventListener("click",(e)=>{
    if(e.target === modal) modal.style.display = "none";
})
render();
</script>
</body>
</html>
